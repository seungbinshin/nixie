[project]
name = "nixie"
version = "0.1.0"
description = "Nixie: personal AI agent with agent-to-agent (A2A) communication"
requires-python = ">=3.11"
dependencies = [
  "a2a-sdk[http-server]==1.3.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
nixie = "nixie.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nixie*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
