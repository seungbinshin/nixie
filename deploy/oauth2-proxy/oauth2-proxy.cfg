# oauth2-proxy (v7.15) in nginx auth_request mode. Values that differ per site come from the environment:
#   OAUTH2_PROXY_OIDC_ISSUER_URL, OAUTH2_PROXY_CLIENT_ID, OAUTH2_PROXY_CLIENT_SECRET,
#   OAUTH2_PROXY_REDIRECT_URL (https://<host>/oauth2/callback), OAUTH2_PROXY_COOKIE_SECRET,
#   OAUTH2_PROXY_WHITELIST_DOMAINS (<host>, and the IdP host for sign-out)
# Use the in-house standard OIDC proxy instead if it gives the same contract:
#   /oauth2/auth -> 202 + X-Auth-Request-User, or 401.
provider = "oidc"
http_address = "0.0.0.0:4180"
reverse_proxy = true
trusted_proxy_ips = ["172.30.10.0/24"]   # the edge network of docker-compose.yml (nginx only)
upstreams = ["static://202"]             # nginx sends traffic to the gateway, not oauth2-proxy
set_xauthrequest = true                  # X-Auth-Request-User (OIDC "sub" claim), -Email, -Preferred-Username
skip_provider_button = true              # no sign-in page: go to the IdP at once
email_domains = ["*"]                    # who may enter is decided by the agent list (sso_user), not by mail domain
code_challenge_method = "S256"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "8h"
cookie_refresh = "1h"
